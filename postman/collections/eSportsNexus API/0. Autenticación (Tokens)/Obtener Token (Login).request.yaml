$kind: http-request
description: Obtiene un token de autenticación pasándole usuario y contraseña.
url: "{{baseUrl}}/auth-token/"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "username": "{{username}}",
        "password": "{{password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      var jsonData = pm.response.json();
      if (jsonData.token) {
          pm.environment.set("token", jsonData.token);
          console.log("Token guardado en el environment:", jsonData.token);
      }
    language: text/javascript
order: 1000
