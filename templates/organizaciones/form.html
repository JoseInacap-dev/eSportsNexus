{% extends "base.html" %}
{% block content %}
<div class="d-flex align-items-center justify-content-between mb-4">
    <div>
        <h2 class="h4 text-light fw-bold mb-1">{{ form_title }}</h2>
        <p class="text-secondary small mb-0">Configura la información general de la organización.</p>
    </div>
    <a href="{% url 'organizations:organization-list' %}" class="btn-nexus-subtle">
        <i class="bi bi-arrow-left"></i>
        <span>Volver a lista</span>
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-12 col-lg-8">
        <div class="nexus-card">
            <div class="nexus-card-header">
                <h3 class="nexus-card-title">Información de la Organización</h3>
            </div>
            <div class="nexus-card-body p-4">
                {% url 'organizations:organization-list' as cancel_url %}
                {% include "_form.html" %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
