{% if is_paginated %}
<nav aria-label="Paginación">
    <ul class="pagination pagination-sm justify-content-center mt-4">
        {% if page_obj.has_previous %}
            <li class="page-item"><a class="page-link bg-dark border-secondary text-light" href="?page=1">Primera</a></li>
            <li class="page-item"><a class="page-link bg-dark border-secondary text-light" href="?page={{ page_obj.previous_page_number }}">Anterior</a></li>
        {% endif %}
        <li class="page-item disabled">
            <span class="page-link bg-dark border-secondary text-secondary">Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
        </li>
        {% if page_obj.has_next %}
            <li class="page-item"><a class="page-link bg-dark border-secondary text-light" href="?page={{ page_obj.next_page_number }}">Siguiente</a></li>
            <li class="page-item"><a class="page-link bg-dark border-secondary text-light" href="?page={{ page_obj.paginator.num_pages }}">Última</a></li>
        {% endif %}
    </ul>
</nav>
{% endif %}
