{% extends "base.html" %}
{% block title %}Confirmar eliminación — NEXUS Esports{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-5">
        <div class="nexus-card border-danger">
            <div class="nexus-card-header">
                <h3 class="nexus-card-title text-danger"><i class="bi bi-exclamation-triangle-fill me-2"></i>Confirmar eliminación</h3>
            </div>
            <div class="nexus-card-body p-4">
                <p class="text-light mb-1">¿Seguro que deseas eliminar <strong class="text-accent">{{ object }}</strong>?</p>
                <p class="text-secondary small mb-4">Esta acción es permanente y no se puede deshacer.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-end gap-2">
                        <a class="btn-nexus-outline" href="javascript:history.back()">Cancelar</a>
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash me-1"></i>Sí, eliminar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
